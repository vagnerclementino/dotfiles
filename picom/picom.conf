# Picom compositor config

backend = "glx";

# Transparency / Opacity
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

# Let apps control their own opacity (e.g. Alacritty)
inactive-opacity-override = false;

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Exclude conky from any effects
focus-exclude = [
    "class_g = 'Conky'"
];

opacity-rule = [
    "100:class_g = 'Conky'"
];

# Shadows (disabled to keep clean)
shadow = false;

# VSync
vsync = true;
